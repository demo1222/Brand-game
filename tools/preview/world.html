<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const views = JSON.parse(decodeURIComponent(location.hash.slice(1)));
function wedge(w,h,d){const g=new THREE.BufferGeometry();const A=[-d/2,-h/2],B=[d/2,-h/2],C=[d/2,h/2];const v=[];const x0=-w/2,x1=w/2;
function tri(a,b,c){v.push(...a,...b,...c)};const P=(x,p)=>[x,p[1],p[0]];
tri(P(x0,A),P(x0,C),P(x0,B));tri(P(x1,A),P(x1,B),P(x1,C));[[A,B],[B,C],[C,A]].forEach(([p,q])=>{tri(P(x0,p),P(x0,q),P(x1,q));tri(P(x0,p),P(x1,q),P(x1,p))});
g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.computeVertexNormals();return g}
fetch('out/world.json').then(r=>r.json()).then(parts=>{
 const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(views.w,views.h);document.body.appendChild(r.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color(views.fog);scene.fog=new THREE.Fog(views.fog,views.fogStart,views.fogEnd);
 scene.add(new THREE.AmbientLight(0xbfd0e0,1.1));const dl=new THREE.DirectionalLight(0xffffff,1.3);dl.position.set(0.4,1,0.3);scene.add(dl);
 for(const p of parts){ if(p.n==='Bound'||p.t>=1) continue; let g;const [sx,sy,sz]=p.s;
  if(p.k==='Ball')g=new THREE.SphereGeometry(Math.min(sx,sy,sz)/2,14,10);
  else if(p.k==='Ellip'){g=new THREE.SphereGeometry(0.5,14,10);g.scale(sx,sy,sz)}
  else if(p.k==='Cylinder'){const d=Math.min(sy,sz);g=new THREE.CylinderGeometry(d/2,d/2,sx,16);g.rotateZ(Math.PI/2)}
  else if(p.k==='WedgePart')g=wedge(sx,sy,sz); else g=new THREE.BoxGeometry(sx,sy,sz);
  const col=new THREE.Color(p.c[0],p.c[1],p.c[2]);
  const mat=p.m==='Neon'?new THREE.MeshBasicMaterial({color:col,fog:false}):new THREE.MeshLambertMaterial({color:col});
  if(p.t>0){mat.transparent=true;mat.opacity=1-p.t;mat.depthWrite=false}
  const m=new THREE.Mesh(g,mat);m.position.set(...p.p);m.rotation.set(p.r[0],p.r[1],p.r[2],'XYZ');scene.add(m);}
 const cam=new THREE.PerspectiveCamera(views.fov,views.w/views.h,0.5,8000);cam.position.set(...views.pos);cam.lookAt(...views.at);
 r.render(scene,cam);document.title='done';
});
</script></body></html>
